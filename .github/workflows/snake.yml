name: Generate Snake

on:
workflow_dispatch:

jobs:
generate:
runs-on: ubuntu-latest


steps:
  - name: Generate snake
    uses: Platane/snk@v3
    with:
      github_user_name: wh0sdev
      outputs: |
        dist/github-contribution-grid-snake.svg

  - name: Deploy snake
    uses: crazy-max/ghaction-github-pages@v4
    with:
      build_dir: dist
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

